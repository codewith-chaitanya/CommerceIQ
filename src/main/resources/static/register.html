<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CommerceIQ</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }
        .auth-card {
            width: min(410px, calc(100% - 48px));
            padding: 32px;
            box-sizing: border-box;
            border: 1px solid #273449;
            border-radius: 18px;
            background: #111b2e;
        }
        .brand { color: #7c9cff; font-size: 14px; font-weight: bold; }
        h1 { margin: 20px 0 8px; font-size: 28px; }
        .subtitle { color: #9caec6; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        label { display: block; margin: 16px 0 8px; font-size: 13px; }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #33445f;
            border-radius: 8px;
            background: #0b1120;
            color: white;
            outline: none;
        }
        input:focus { border-color: #7c9cff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #6d8cff;
            color: #081020;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .message { min-height: 20px; margin-top: 14px; font-size: 13px; color: #ff9999; }
        .message.success { color: #6ee7b7; }
        .footer { margin-top: 20px; text-align: center; color: #9caec6; font-size: 14px; }
        a { color: #9db2ff; text-decoration: none; }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="brand">CommerceIQ</div>
    <h1>Create account</h1>
    <p class="subtitle">Create your account to explore your e-commerce analytics dashboard.</p>

    <form id="registerForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password"
               minlength="8" maxlength="72" required>

        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password"
               minlength="8" maxlength="72" required>

        <button type="submit">Create account</button>
        <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>

    <p class="footer">Already registered? <a href="/login.html">Sign in</a></p>
</main>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        message.classList.remove("success");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8 || password.length > 72) {
            message.textContent = "Password must contain 8 to 72 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        button.disabled = true;
        button.textContent = "Creating account...";

        try {
            const csrfResponse = await fetch("/api/auth/csrf", {
                credentials: "same-origin"
            });

            if (!csrfResponse.ok) {
                throw new Error("Unable to initialize secure registration.");
            }

            const csrf = await csrfResponse.json();

            const response = await fetch("/api/auth/register", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json",
                    [csrf.headerName]: csrf.token
                },
                body: JSON.stringify({ email, password })
            });

            if (response.status === 201) {
                message.classList.add("success");
                message.textContent = "Account created successfully! Redirecting to login...";
                setTimeout(() => {
                    window.location.href = "/login.html?registered=true";
                }, 1000);
                return;
            }

            const errorBody = await response.json().catch(() => ({}));
            if (response.status === 409) {
                throw new Error("This email is already registered. Please sign in.");
            }
            if (response.status === 403) {
                throw new Error("Security token expired. Refresh the page and try again.");
            }

            throw new Error(errorBody.detail || errorBody.message || "Registration failed.");
        } catch (error) {
            message.textContent = error.message || "Could not connect to the server.";
        } finally {
            button.disabled = false;
            button.textContent = "Create account";
        }
    });
</script>
</body>
</html>
