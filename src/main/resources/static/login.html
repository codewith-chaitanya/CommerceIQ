
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CommerceIQ</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .auth-card {
            width: min(390px, calc(100% - 48px));
            padding: 32px;
            border: 1px solid #273449;
            border-radius: 18px;
            background: #111b2e;
            box-sizing: border-box;
        }
        .brand { color: #7c9cff; font-size: 14px; font-weight: bold; }
        h1 { margin: 20px 0 8px; font-size: 28px; }
        .subtitle { color: #9caec6; font-size: 14px; margin-bottom: 26px; }
        label { display: block; margin: 16px 0 8px; font-size: 13px; }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #33445f;
            border-radius: 8px;
            background: #0b1120;
            color: white;
            outline: none;
        }
        input:focus { border-color: #7c9cff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #6d8cff;
            color: #081020;
            font-weight: bold;
            cursor: pointer;
        }
        .message { min-height: 20px; font-size: 13px; margin-top: 14px; color: #ff9999; }
        .footer { margin-top: 20px; text-align: center; color: #9caec6; font-size: 14px; }
        a { color: #9db2ff; text-decoration: none; }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="brand">CommerceIQ</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to analyze your e-commerce data.</p>

    <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="username" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
        <p id="message" class="message" role="alert"></p>
    </form>

    <p class="footer">New here? <a href="/register.html">Create an account</a></p>
</main>


<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = form.querySelector("button");

    const params = new URLSearchParams(window.location.search);

    if (params.get("error") === "true") {
        message.textContent = "Invalid email or password.";
    }

    if (params.get("registered") === "true") {
        message.style.color = "#6ee7b7";
        message.textContent = "Account created successfully. Please sign in.";
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        message.style.color = "#ff9999";
        button.disabled = true;
        button.textContent = "Signing in...";

        try {
            const csrfResponse = await fetch("/api/auth/csrf", {
                credentials: "same-origin"
            });

            if (!csrfResponse.ok) {
                throw new Error("Unable to initialize secure login.");
            }

            const csrf = await csrfResponse.json();

            const body = new URLSearchParams({
                username: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                _csrf: csrf.token
            });

            await fetch("/login", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    [csrf.headerName]: csrf.token
                },
                body,
                redirect: "manual"
            });

            const check = await fetch("/api/transactions", {
                credentials: "same-origin"
            });

            if (check.ok) {
                window.location.replace("/");
                return;
            }

            throw new Error("Invalid email or password.");
        } catch (error) {
            message.textContent = error.message || "Login failed. Please try again.";
        } finally {
            button.disabled = false;
            button.textContent = "Sign in";
        }
    });
</script>

</body>
</html>
